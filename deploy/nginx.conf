# ============================================================
#  Epic Moments — Nginx site config (Oracle Cloud VM)
#  Place at: /etc/nginx/sites-available/epicmoments
#  Then:     sudo ln -s /etc/nginx/sites-available/epicmoments \
#                        /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
#
#  Serves:
#    myepicmoments.com          -> frontend static build
#    admin.myepicmoments.com    -> admin static build
#    /api/  and  /socket.io/    -> Node backend on 127.0.0.1:4000
# ============================================================

# ---------- Customer storefront ----------
server {
    listen 80;
    server_name myepicmoments.com www.myepicmoments.com;

    root /var/www/epicmoments/frontend;
    index index.html;

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to Node backend
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (socket.io) proxy
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # cache static assets
    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|woff2?|mp3)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    client_max_body_size 25M;   # allow product image/video uploads
}

# ---------- Admin dashboard (subdomain) ----------
server {
    listen 80;
    server_name admin.myepicmoments.com;

    root /var/www/epicmoments/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    client_max_body_size 25M;
}
